[workspace]
resolver = "2"
members = ["crates/core", "crates/provider-sqlite", "crates/provider-javadashboard", "crates/provider-todoist", "crates/activity", "crates/sync", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/Wilsoon7721/Multitasker"

[workspace.dependencies]
multitasker-core = { path = "crates/core" }
multitasker-provider-sqlite = { path = "crates/provider-sqlite" }
multitasker-provider-javadashboard = { path = "crates/provider-javadashboard" }
multitasker-provider-todoist = { path = "crates/provider-todoist" }
multitasker-activity = { path = "crates/activity" }
multitasker-sync = { path = "crates/sync" }
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
rusqlite = { version = "0.43", features = ["bundled", "chrono"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
