<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>MultiTasker</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="page">
      <img src="icons/32.png" alt="" width="20" height="20" />
      <div class="page-text">
        <div class="page-title" id="page-title">This page</div>
        <div class="page-url" id="page-url"></div>
      </div>
    </header>

    <p class="unlinkable" id="unlinkable" hidden>
      This is one of the browser's own pages, which only open inside the browser, so it can't be linked to a task.
      Web pages (http and https) can.
    </p>

    <p class="notice" id="notice" hidden></p>

    <div class="confirm" id="confirm" role="status" hidden>
      <span id="confirm-text"></span>
      <button type="button" class="link" id="confirm-open">Open MultiTasker</button>
    </div>

    <main id="main" hidden>
      <input id="filter" type="search" placeholder="Find a task" aria-label="Find a task" />
      <ul class="tasks" id="tasks" aria-label="Open tasks"></ul>
      <p class="empty" id="empty" hidden>No open tasks match.</p>

      <form class="create" id="create">
        <input id="new-title" placeholder="New task from this page" aria-label="New task title" maxlength="200" />
        <button type="submit" class="primary" id="add">Add</button>
      </form>
    </main>

    <footer>
      <button type="button" class="link" id="show-app">Open MultiTasker</button>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
