[package]
name = "multitasker"
description = "An always-on-top focus list for people who juggle many tasks"
version.workspace = true
edition.workspace = true
repository.workspace = true

[lib]
name = "multitasker_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
multitasker-core.workspace = true
multitasker-provider-sqlite.workspace = true
multitasker-provider-javadashboard.workspace = true
multitasker-provider-todoist.workspace = true
multitasker-provider-notion.workspace = true
multitasker-deliverables.workspace = true
multitasker-activity.workspace = true
multitasker-sync.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
keyring = "4"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tokio = { workspace = true, features = ["net", "io-util", "time"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Registry"] }
